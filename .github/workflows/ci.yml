name: CI

# Unit tests, then the Playwright e2e suite against the built container,
# then (master pushes only) the multi-arch image to Docker Hub.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A master run is never cancelled half way through a push
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E tests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the app
        run: docker compose up --build -d

      - name: Wait for the app
        run: curl -sf --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:3000/

      # Same image and command as a local run (see CLAUDE.md). Env does not
      # cross docker run, so CI is passed explicitly for the CI-only config.
      - name: Run Playwright
        run: >-
          docker run --rm --network host --ipc=host -e CI=true -e E2E_WORKERS
          -v "$GITHUB_WORKSPACE/e2e:/e2e" -w /e2e
          mcr.microsoft.com/playwright:v1.48.2-jammy
          sh -c "npm ci && npx playwright test"

      - name: App logs
        if: failure()
        run: docker compose logs

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

      # A test retried in CI (e2e/FLAKES.md) that passed on its retry leaves
      # the job green, but the trace of its failed attempt is kept in
      # test-results. Upload it so the flake can be diagnosed. A clean run
      # keeps only the hidden .last-run.json there, which upload-artifact
      # skips, so nothing is uploaded then.
      - name: Upload traces of retried tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flaky-traces
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the app
        if: always()
        run: docker compose down

  publish:
    name: Build and push image
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: igorosky/gantt-editor
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
